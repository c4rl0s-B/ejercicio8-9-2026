<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>actualizar usuario</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/actulizar.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <h1>Actualiza tu usuario</h1>
        <p>volver</p>
        <a href="{{url_for('lista')}}"><i class="bi bi-arrow-return-left"></i></a>
    </header>
    <main>
        <section>
            <form action="{{url_for('actualizar', user_id=usuario.id)}}" method="POST">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre}}"
                    required
                    >
                </div>
                <div>
                    <label for="apellido">Apellido:</label>
                    <input type="text" 
                    id="apellido" 
                    name="apellido"
                    value="{{ usuario.apellido}}"
                    required
                    >
                </div>
                <div>
                    <label for="edad">Edad:</label>

                    <input type="number"
                    id="edad"
                    name="edad"
                    value="{{usuario.edad}}"
                    required
                    >
                </div>
                <button type="submit">
                    Guardar canbios
                </button>
            </form>
        </section>
    </main>
</body>
</html>
